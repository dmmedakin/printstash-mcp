name: Build image

# Publishes ghcr.io/<owner>/printstash-mcp for amd64 and arm64.
#   - on every push to main that touches the server or its build;
#   - every Monday, so the image picks up Python and library fixes;
#   - by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - server.py
      - api_catalog.json
      - requirements.txt
      - Dockerfile
      - .github/workflows/image.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/printstash-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for this runner first and check that the server actually starts:
      # with no PrintStash behind it, /healthz must answer 503 and the MCP
      # endpoint must list the tools.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: printstash-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e PRINTSTASH_URL=http://127.0.0.1:9 -e MCP_PATH=/mcp-test \
            printstash-mcp:test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || true)
            [ "$code" = "503" ] && break
            sleep 1
          done
          [ "$code" = "503" ] || { docker logs smoke; echo "healthz answered '$code'"; exit 1; }
          curl -s -X POST http://127.0.0.1:8000/mcp-test \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' > tools.json
          python3 - <<'EOF'
          import json
          names = [t["name"] for t in json.load(open("tools.json"))["result"]["tools"]]
          print(len(names), "tools:", ", ".join(names))
          assert {"search_models", "get_model", "log_print"} <= set(names), names
          EOF
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
